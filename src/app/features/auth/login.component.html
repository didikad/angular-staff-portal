<main class="flex min-h-screen items-center justify-center bg-stone-100 px-4">
    <section class="w-full max-w-sm rounded-xl bg-red-900 p-8 shadow-lg" aria-labelledby="login-title">
        <h1 id="login-title" class="text-center text-xl font-semibold text-white">
            Login Your Account
        </h1>

        <form class="mt-7 space-y-5">
            <div class="space-y-2">
                <label for="username" class="block text-sm font-medium text-white">
                    Username
                </label>
                <input id="username" name="username" type="text" autocomplete="username" required
                    class="w-full rounded-md border border-red-200 bg-white px-3 py-2.5 text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-300" />
            </div>

            <div class="space-y-2">
                <label for="password" class="block text-sm font-medium text-white">
                    Password
                </label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                    class="w-full rounded-md border border-red-200 bg-white px-3 py-2.5 text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-300" />
            </div>

            <button type="submit"
                class="w-full rounded-md bg-amber-400 px-4 py-2.5 font-semibold text-red-950 transition hover:bg-amber-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-red-900">
                Login
            </button>
        </form>
    </section>
</main>
