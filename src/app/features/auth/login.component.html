<main class="flex min-h-screen items-center justify-center bg-stone-100 px-4">
    <section class="w-full max-w-sm rounded-xl bg-red-900 p-8 shadow-lg" aria-labelledby="login-title">
        <h1 id="login-title" class="text-center text-xl font-semibold text-white">
            Login Your Account
        </h1>

        <form [formGroup]="loginForm" (ngSubmit)="login()" class="mt-7 space-y-5" novalidate>
            <div class="space-y-2">
                <label for="username" class="block text-sm font-medium text-white">
                    Username
                </label>
                <input id="username" formControlName="username" type="text" autocomplete="username"
                    (input)="clearError()" [attr.aria-invalid]="hasFieldError('username')"
                    [attr.aria-describedby]="hasFieldError('username') ? 'username-error' : null"
                    class="w-full rounded-md border border-red-200 bg-white px-3 py-2.5 text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-300" />
                @if (hasFieldError('username')) {
                    <p id="username-error" class="text-sm text-amber-100">Username wajib diisi.</p>
                }
            </div>

            <div class="space-y-2">
                <label for="password" class="block text-sm font-medium text-white">
                    Password
                </label>
                <input id="password" formControlName="password" type="password" autocomplete="current-password"
                    (input)="clearError()" [attr.aria-invalid]="hasFieldError('password')"
                    [attr.aria-describedby]="hasFieldError('password') ? 'password-error' : null"
                    class="w-full rounded-md border border-red-200 bg-white px-3 py-2.5 text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-300" />
                @if (hasFieldError('password')) {
                    <p id="password-error" class="text-sm text-amber-100">Password wajib diisi.</p>
                }
            </div>

            @if (errorMessage) {
                <p class="text-sm text-amber-100" role="alert">{{ errorMessage }}</p>
            }

            <button type="submit" [disabled]="loading"
                class="w-full rounded-md bg-amber-400 px-4 py-2.5 font-semibold text-red-950 transition hover:bg-amber-300 disabled:cursor-not-allowed disabled:opacity-60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-red-900">
                {{ loading ? 'Memeriksa...' : 'Login' }}
            </button>
        </form>

        <p class="mt-5 rounded bg-red-800 p-3 text-sm text-white">
            Akun testing: <strong>admin</strong> / <strong>admin123</strong>
        </p>
    </section>
</main>
