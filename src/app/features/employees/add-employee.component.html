<section class="mx-auto max-w-4xl space-y-6">
  <div>
    <a routerLink="/dashboard/employees" class="text-sm text-red-800 hover:underline">← Kembali ke daftar</a>
    <h1 class="mt-3 text-3xl font-semibold text-red-900">Tambah karyawan</h1>
    <p class="mt-2 text-sm text-slate-700">Isi seluruh informasi karyawan.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="rounded border border-stone-200 bg-white p-4 sm:p-6" novalidate>
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="grid gap-1.5 text-sm font-medium">Username
        <input formControlName="username" autocomplete="off" placeholder="nama.username" class="h-11 rounded border border-stone-300 px-3 font-normal focus-visible:outline-2 focus-visible:outline-red-800" />
        @if (hasError('username')) { <small class="text-red-800">Username wajib diisi dan hanya boleh memakai huruf, angka, titik, strip, atau garis bawah.</small> }
      </label>
      <label class="grid gap-1.5 text-sm font-medium">Email
        <input type="email" formControlName="email" autocomplete="email" placeholder="nama@contoh.co.id" class="h-11 rounded border border-stone-300 px-3 font-normal focus-visible:outline-2 focus-visible:outline-red-800" />
        @if (hasError('email')) { <small class="text-red-800">Masukkan email dengan format yang valid.</small> }
      </label>
      <label class="grid gap-1.5 text-sm font-medium">Nama depan
        <input formControlName="firstName" autocomplete="given-name" class="h-11 rounded border border-stone-300 px-3 font-normal focus-visible:outline-2 focus-visible:outline-red-800" />
        @if (hasError('firstName')) { <small class="text-red-800">Nama depan wajib diisi.</small> }
      </label>
      <label class="grid gap-1.5 text-sm font-medium">Nama belakang
        <input formControlName="lastName" autocomplete="family-name" class="h-11 rounded border border-stone-300 px-3 font-normal focus-visible:outline-2 focus-visible:outline-red-800" />
        @if (hasError('lastName')) { <small class="text-red-800">Nama belakang wajib diisi.</small> }
      </label>
      <label class="grid gap-1.5 text-sm font-medium">Tanggal lahir
        <input type="datetime-local" [max]="maxBirthDate" formControlName="birthDate" class="h-11 rounded border border-stone-300 px-3 font-normal focus-visible:outline-2 focus-visible:outline-red-800" />
        @if (hasError('birthDate')) { <small class="text-red-800">Tanggal lahir wajib diisi.</small> }
      </label>
      <label class="grid gap-1.5 text-sm font-medium">Gaji pokok
        <input type="number" min="0" step="1" inputmode="numeric" formControlName="basicSalary" placeholder="0" class="h-11 rounded border border-stone-300 px-3 font-normal focus-visible:outline-2 focus-visible:outline-red-800" />
        @if (hasError('basicSalary')) { <small class="text-red-800">Gaji harus berupa angka nol atau lebih.</small> }
      </label>
      <label class="grid gap-1.5 text-sm font-medium">Status
        <select formControlName="status" class="h-11 rounded border border-stone-300 bg-white px-3 font-normal focus-visible:outline-2 focus-visible:outline-red-800"><option value="">Pilih status</option><option value="Active">Active</option><option value="Inactive">Inactive</option><option value="Probation">Probation</option></select>
        @if (hasError('status')) { <small class="text-red-800">Pilih status karyawan.</small> }
      </label>
      <div class="grid content-start gap-1.5 text-sm font-medium">
        <label for="group-search">Group</label>
        <input id="group-search" type="search" [value]="groupSearch" (input)="groupSearch = $any($event.target).value" placeholder="Cari group" class="h-10 rounded border border-stone-300 px-3 font-normal focus-visible:outline-2 focus-visible:outline-red-800" />
        <select formControlName="group" class="h-11 rounded border border-stone-300 bg-white px-3 font-normal focus-visible:outline-2 focus-visible:outline-red-800"><option value="">Pilih group</option>@for (group of filteredGroups; track group) { <option [value]="group">{{ group }}</option> }</select>
        @if (hasError('group')) { <small class="text-red-800">Pilih group karyawan.</small> }
      </div>
      <label class="grid gap-1.5 text-sm font-medium sm:col-span-2">Description
        <input type="datetime-local" formControlName="description" class="h-11 rounded border border-stone-300 px-3 font-normal focus-visible:outline-2 focus-visible:outline-red-800" />
        @if (hasError('description')) { <small class="text-red-800">Tanggal dan waktu wajib diisi.</small> }
      </label>
    </div>

    <div class="mt-6 flex flex-col-reverse justify-end gap-3 border-t border-stone-200 pt-4 sm:flex-row">
      <a routerLink="/dashboard/employees" class="inline-flex min-h-11 items-center justify-center rounded border border-stone-300 px-4 text-sm font-medium text-slate-800 hover:bg-stone-100">Batal</a>
      <button type="submit" class="min-h-11 rounded bg-amber-400 px-5 text-sm font-semibold text-red-950 hover:bg-amber-300">Simpan karyawan</button>
    </div>
  </form>
</section>
